<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 検索エンジンにインデックスさせない設定 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<title>Happy Birthday</title>

<!-- 中身はすべて暗号化（AES-GCM 256bit／PBKDF2）されています。合言葉がないと読めません。 -->
<style>
  :root{
    --bg:#fff7f1; --card:#ffffff; --ink:#4a3b36; --sub:#9a8279;
    --accent:#ff8a80; --accent2:#ffb74d; --line:#ffd8cc;
    --shadow:0 8px 24px rgba(214,140,120,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo",-apple-system,sans-serif;
    background:#f3e6de; color:var(--ink); line-height:1.8; -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:430px; margin:0 auto; min-height:100vh; background:var(--bg);
    box-shadow:0 0 40px rgba(0,0,0,.08); overflow:hidden; position:relative;
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  [hidden]{display:none !important}

  /* ===== 合言葉画面 ===== */
  .gate{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:32px 28px; text-align:center;
    background:linear-gradient(160deg,#ffd6cc 0%,#ffe9c9 60%,#fff7f1 100%);
  }
  .gate .gift{font-size:64px; line-height:1; animation:bob 2s infinite}
  .gate h1{font-size:22px; margin:18px 0 4px}
  .gate p{font-size:13px; color:var(--sub); margin-bottom:24px}
  .gate form{width:100%; max-width:320px}
  .gate input[type=password]{
    width:100%; padding:14px 16px; font-size:16px; font-family:inherit; border-radius:14px;
    border:2px solid var(--line); background:#fff; outline:none; text-align:center; color:var(--ink);
  }
  .gate input[type=password]:focus{border-color:var(--accent)}
  .gate label.remember{display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:var(--sub); margin:12px 0 4px}
  .btn{
    display:block; width:100%; margin-top:14px; padding:14px; border:none; border-radius:99px;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer;
  }
  .btn:disabled{opacity:.6}
  .err{color:#d9534f; font-size:13px; min-height:1.8em; margin-top:10px}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* ===== ヒーロー ===== */
  .hero{
    text-align:center; padding:72px 24px 48px;
    background:linear-gradient(160deg,#ffd6cc 0%,#ffe9c9 60%,#fff7f1 100%);
    border-radius:0 0 36px 36px;
  }
  .hero .badge{display:inline-block; font-size:12px; letter-spacing:.2em; color:#fff; background:var(--accent); padding:4px 14px; border-radius:99px}
  .hero h1{font-size:30px; margin:18px 0 6px; line-height:1.4}
  .hero .num{
    font-size:96px; font-weight:700; line-height:1;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero p{color:var(--sub); font-size:14px; margin-top:10px; white-space:pre-wrap}
  .scroll-hint{margin-top:28px; font-size:12px; color:var(--sub); animation:bob 1.8s infinite}
  @keyframes bob{50%{transform:translateY(6px)}}

  section{padding:40px 20px 8px}
  .sec-title{text-align:center; margin-bottom:28px}
  .sec-title small{display:block; font-size:11px; letter-spacing:.25em; color:var(--accent)}
  .sec-title h2{font-size:22px}

  /* ===== タイムライン ===== */
  .timeline{position:relative; padding-left:34px}
  .timeline::before{content:""; position:absolute; left:12px; top:6px; bottom:6px; width:3px; background:linear-gradient(var(--accent),var(--accent2)); border-radius:3px}
  .t-item{position:relative; margin-bottom:22px; opacity:0; transform:translateY(24px); transition:.7s ease}
  .t-item.show{opacity:1; transform:none}
  .t-dot{position:absolute; left:-34px; top:14px; width:27px; height:27px; border-radius:50%; background:#fff; border:3px solid var(--accent); display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--accent)}
  .t-card{background:var(--card); border-radius:18px; padding:16px 18px; box-shadow:var(--shadow)}
  .t-age{font-size:12px; color:var(--accent); font-weight:700}
  .t-card h3{font-size:16px; margin:2px 0 6px}
  .t-card p{font-size:14px; white-space:pre-wrap}
  .t-card img{width:100%; border-radius:12px; margin-top:10px; display:block}
  .t-links{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  .t-link{border:1px solid var(--accent); background:#fff; color:var(--accent); font-family:inherit; font-size:13px; font-weight:700; padding:7px 14px; border-radius:99px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .t-link:active{background:var(--accent); color:#fff}
  .t-link:focus-visible,.capsule:focus-visible{outline:3px solid var(--accent2); outline-offset:2px}

  /* ===== タイムカプセル ===== */
  .capsules{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .capsule{
    border:none; cursor:pointer; font-family:inherit; color:var(--ink); background:var(--card);
    border-radius:20px; padding:20px 10px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .capsule:active{transform:scale(.95)}
  .capsule .icon{font-size:34px; line-height:1}
  .capsule .age{font-size:20px; font-weight:700}
  .capsule .state{font-size:11px; color:var(--sub)}
  .capsule.locked{opacity:.75}
  .capsule.opened .state{color:var(--accent)}

  .modal{position:fixed; inset:0; background:rgba(60,40,35,.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .3s}
  .modal.open{opacity:1; pointer-events:auto}
  .sheet{width:100%; max-width:430px; background:#fffaf5; border-radius:28px 28px 0 0; padding:28px 24px calc(28px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .4s cubic-bezier(.2,.9,.3,1); max-height:85vh; overflow-y:auto}
  .modal.open .sheet{transform:none}
  .sheet .grab{width:44px; height:5px; background:#e8d5cc; border-radius:3px; margin:0 auto 18px}
  .sheet h3{text-align:center; font-size:20px; margin-bottom:4px}
  .sheet .date{text-align:center; font-size:12px; color:var(--sub); margin-bottom:18px}
  .photos{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
  .photos img{width:100%; border-radius:12px; display:block}
  .photos.one{grid-template-columns:1fr}
  .media{display:flex; flex-direction:column; gap:10px; margin-bottom:14px}
  .media video{width:100%; border-radius:12px; background:#000; display:block}
  .vbtn,.lnk{display:block; width:100%; text-align:center; border:1px solid var(--accent); background:#fff; color:var(--accent); font-family:inherit; font-size:14px; font-weight:700; padding:12px; border-radius:14px; cursor:pointer; text-decoration:none}
  .vnote{font-size:12px; color:var(--sub); text-align:center}
  .letter{background:#fff; border-radius:16px; padding:20px; font-size:15px; white-space:pre-wrap; border:1px dashed var(--line); line-height:2}

  footer{text-align:center; padding:40px 20px 0; color:var(--sub); font-size:13px}
  footer .sign{font-size:16px; color:var(--ink); margin-top:6px}
  .logout{background:none; border:none; color:var(--sub); font-size:11px; text-decoration:underline; margin-top:24px; cursor:pointer; font-family:inherit}

  .confetti{position:fixed; top:-12px; width:8px; height:14px; z-index:60; pointer-events:none; border-radius:2px; animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg); opacity:.6}}
</style>
</head>
<body>
<div class="app">

  <!-- 合言葉画面 -->
  <div class="gate" id="gate">
    <div class="gift">🎁</div>
    <h1>Happy Birthday</h1>
    <p>合言葉を入れてね</p>
    <form id="gateForm" autocomplete="off">
      <input type="password" id="pass" placeholder="合言葉" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <label class="remember"><input type="checkbox" id="remember"> この端末で合言葉を覚える</label>
      <button class="btn" id="openBtn" type="submit">ひらく</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <!-- 本編（合言葉で解除後に表示） -->
  <div id="main" hidden>
    <header class="hero">
      <span class="badge">HAPPY BIRTHDAY</span>
      <h1 id="heroName"></h1>
      <div class="num" id="heroAge"></div>
      <p id="heroMsg"></p>
      <div class="scroll-hint">▼ スクロールしてね</div>
    </header>
    <section>
      <div class="sec-title"><small>MEMORIAL LOG</small><h2 id="tlTitle"></h2></div>
      <div class="timeline" id="timeline"></div>
    </section>
    <section>
      <div class="sec-title"><small>TIME CAPSULE</small><h2>未来へのタイムカプセル</h2></div>
      <div class="capsules" id="capsules"></div>
    </section>
    <footer>
      <p id="footMsg"></p>
      <p class="sign" id="sign"></p>
      <button class="logout" id="logout">この端末の合言葉を忘れる</button>
    </footer>
  </div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h3 id="mTitle"></h3>
    <div class="date" id="mDate"></div>
    <div class="photos" id="mPhotos" hidden></div>
    <div class="media" id="mMedia" hidden></div>
    <div class="letter" id="mBody"></div>
    <button class="btn" id="mClose" type="button">とじる</button>
  </div>
</div>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const STORE_KEY = "hb-pass";
const store = {
  get(){ try { return localStorage.getItem(STORE_KEY); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(STORE_KEY, v); } catch(e){} },
  del(){ try { localStorage.removeItem(STORE_KEY); } catch(e){} }
};

async function decrypt(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(PAYLOAD.s), iterations:PAYLOAD.it, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(PAYLOAD.i) }, key, b64(PAYLOAD.c));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function tryOpen(pass, fromStore){
  $("openBtn").disabled = true; $("openBtn").textContent = "ひらいています…"; $("err").textContent = "";
  if (!(window.crypto && crypto.subtle)){  // 暗号の機能が使えない開き方（http:// や一部のプレビュー）では、合言葉の誤りと区別して知らせる
    $("err").textContent = "この開き方では合言葉を確かめられません。https:// のページで開いてください。";
    $("openBtn").disabled = false; $("openBtn").textContent = "ひらく"; return;
  }
  try {
    const data = await decrypt(pass);
    if ($("remember").checked) store.set(pass);
    render(data);
  } catch(e){
    if (fromStore){ store.del(); }
    else {
      $("err").textContent = "合言葉がちがうみたい。もう一度ためしてね。";
      $("gateForm").classList.remove("shake"); void $("gateForm").offsetWidth; $("gateForm").classList.add("shake");
    }
  } finally {
    $("openBtn").disabled = false; $("openBtn").textContent = "ひらく";
  }
}

$("gateForm").addEventListener("submit", e => { e.preventDefault(); tryOpen($("pass").value, false); });
$("logout").addEventListener("click", () => { store.del(); location.reload(); });
const saved = store.get();
if (saved){ $("remember").checked = true; tryOpen(saved, true); }

/* ===== 本編の描画 ===== */
let CFG = {};
function render(d){
  CFG = d.config || {};
  $("heroName").textContent = (CFG.name || "") + "へ";
  $("heroAge").textContent = CFG.age ?? 13;
  $("heroMsg").textContent = CFG.heroMessage || "";
  $("tlTitle").textContent = (CFG.age ?? 13) + "年間のきろく";
  $("footMsg").textContent = CFG.footerMessage || "";
  $("sign").textContent = CFG.from || "";
  document.title = "Happy " + (CFG.age ?? 13) + "th Birthday";

  const tl = $("timeline"); tl.innerHTML = "";
  (d.timeline || []).forEach(t => {
    const el = document.createElement("div"); el.className = "t-item";
    const dot = document.createElement("div"); dot.className = "t-dot"; dot.textContent = t.age;
    const card = document.createElement("div"); card.className = "t-card";
    const a = document.createElement("div"); a.className = "t-age"; a.textContent = t.age + "歳";
    const h = document.createElement("h3"); h.textContent = t.title || "";
    const p = document.createElement("p"); p.textContent = t.text || "";
    card.append(a, h, p);
    if (t.photo){ const img = document.createElement("img"); img.src = t.photo; img.alt = t.age + "歳の写真"; img.loading = "lazy"; card.append(img); }
    const links = document.createElement("div"); links.className = "t-links";
    if (t.letter){ const b = document.createElement("button"); b.type = "button"; b.className = "t-link"; b.textContent = "✉️ 手紙を読む";
      b.addEventListener("click", () => openSheet(`${t.age}歳の${CFG.name || ""}へ`, t.letterDate || "", t.letter, [])); links.append(b); }
    if (t.diary && (t.diary.text || ["photos","videos","links"].some(k => (t.diary[k] || []).length))){ const b = document.createElement("button"); b.type = "button"; b.className = "t-link"; b.textContent = "📖 日記を読む";
      b.addEventListener("click", () => openSheet(`${t.age}歳の誕生日のころ`, t.diary.date || "", t.diary.text || "", t.diary.photos || [], t.diary.videos || [], t.diary.links || [])); links.append(b); }
    if (links.children.length) card.append(links);
    el.append(dot, card); tl.append(el);
  });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("show"); io.unobserve(e.target); } }), { threshold:.15 });
  document.querySelectorAll(".t-item").forEach(el => io.observe(el));

  const wrap = $("capsules"); wrap.innerHTML = "";
  (d.capsules || []).forEach(c => {
    const b = document.createElement("button"); b.type = "button";
    const locked = isLocked(c);
    b.className = "capsule" + (locked ? " locked" : "");
    const i = document.createElement("span"); i.className = "icon"; i.textContent = locked ? "🔒" : (c.icon || "💌");
    const g = document.createElement("span"); g.className = "age"; g.textContent = c.anytime ? "いつか" : c.age + "歳";
    const s = document.createElement("span"); s.className = "state"; s.textContent = locked ? fmt(unlockDate(c.age)) + "に開くよ" : "タップして開く";
    b.append(i, g, s);
    b.addEventListener("click", () => openCapsule(c, b));
    wrap.append(b);
  });

  $("gate").hidden = true; $("main").hidden = false; window.scrollTo(0, 0);
  setTimeout(() => confetti(60), 300);
}

const unlockDate = age => { const b = new Date((CFG.birthday || "2000-01-01") + "T00:00:00"); return new Date(b.getFullYear() + Number(age), b.getMonth(), b.getDate()); };
const isLocked = c => !!CFG.lockUntilBirthday && !c.anytime && new Date() < unlockDate(c.age);
const fmt = d => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

function openCapsule(c, btn){
  const locked = isLocked(c);
  $("mTitle").textContent = c.anytime ? `いつかの${CFG.name || ""}へ` : `${c.age}歳の${CFG.name || ""}へ`;
  $("mDate").textContent = c.anytime ? "" : (locked ? "まだ開けられないよ" : `${fmt(unlockDate(c.age))} の誕生日に`);
  $("mBody").textContent = locked ? `このカプセルは ${fmt(unlockDate(c.age))} に開けられます。\nその日まで、楽しみに待っていてね。` : (c.text || "");
  setPhotos(locked || !c.photo ? [] : [c.photo]); setMedia([], []);
  showModal();
  if (!locked){ btn.classList.add("opened"); btn.querySelector(".state").textContent = "ひらいたよ"; confetti(); }
}
function setPhotos(list){
  const w = $("mPhotos"); w.innerHTML = ""; w.hidden = !list.length; w.className = "photos" + (list.length === 1 ? " one" : "");
  list.forEach((src, i) => { const img = document.createElement("img"); img.src = src; img.alt = "写真" + (i + 1); w.append(img); });
}
function showModal(){ $("modal").classList.add("open"); $("modal").setAttribute("aria-hidden", "false"); $("modal").querySelector(".sheet").scrollTop = 0; }
function openSheet(title, date, body, photos, videos = [], links = []){
  $("mTitle").textContent = title; $("mDate").textContent = date; $("mBody").textContent = body; setPhotos(photos); setMedia(videos, links); showModal();
}
/* 動画：別ファイルの暗号データを、押したときだけ読み込んで復号する（通信量を抑えるため） */
function setMedia(videos, links){
  const w = $("mMedia"); w.querySelectorAll("video").forEach(v => { if (v.src) URL.revokeObjectURL(v.src); });
  w.innerHTML = ""; w.hidden = !(videos.length || links.length);
  videos.forEach((m, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "vbtn";
    b.textContent = `▶ 動画${videos.length > 1 ? (i + 1) : ""}を読み込む（約${Math.max(1, Math.round((m.size || 0) / 1048576))}MB）`;
    b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "読み込んでいます…";
      try {
        const r = await fetch(m.file, { cache:"force-cache" }); if (!r.ok) throw new Error("fetch");
        const key = await crypto.subtle.importKey("raw", b64(m.key), "AES-GCM", false, ["decrypt"]);
        const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(m.iv) }, key, await r.arrayBuffer());
        const v = document.createElement("video"); v.controls = true; v.playsInline = true; v.preload = "metadata";
        v.src = URL.createObjectURL(new Blob([plain], { type:m.type || "video/mp4" })); b.replaceWith(v);
      } catch(e){
        b.disabled = false; b.textContent = "▶ もう一度読み込む";
        const n = document.createElement("p"); n.className = "vnote";
        n.textContent = !/^https?:$/.test(location.protocol) ? "動画は、公開したページでのみ再生できます。" : "動画を読み込めませんでした。通信状態を確かめて、もう一度押してください。";
        if (!b.nextElementSibling || !b.nextElementSibling.classList.contains("vnote")) b.after(n);
      }
    });
    w.append(b);
  });
  links.filter(l => /^https?:\/\//i.test(l.url || "")).forEach(l => {
    const a = document.createElement("a"); a.className = "lnk"; a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "🔗 " + (l.label || "動画を開く"); w.append(a);
  });
}
const closeModal = () => { $("mMedia").querySelectorAll("video").forEach(v => v.pause()); $("modal").classList.remove("open"); $("modal").setAttribute("aria-hidden", "true"); };
$("mClose").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if (e.target === $("modal")) closeModal(); });

function confetti(n = 40){
  const colors = ["#ff8a80","#ffb74d","#ffd54f","#81d4fa","#ce93d8","#a5d6a7"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span"); s.className = "confetti";
    s.style.left = Math.random()*100 + "vw"; s.style.background = colors[i % colors.length];
    s.style.animationDuration = (2 + Math.random()*2) + "s"; s.style.animationDelay = Math.random()*.5 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 4600);
  }
}
